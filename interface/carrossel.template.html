<title>Grace Studio Carrosséis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@300;400;600;700;800;900&family=Manrope:wght@300;500;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: mesma ilha de edição do Modo Editor (tema escuro único). Topo = etapas; meio = briefing | slide ativo | agentes; base = faixa de slides com pistas. */
:root{
  color-scheme:dark;
  --fundo:#0C0A22; --painel:#151239; --painel2:#1C1850; --linha:#2E2970; --texto:#EEEBFF; --mudo:#9D97D8;
  --coral:#FF7A45; --ciano:#45D6FF; --amarelo:#FFD24A; --azul:#7C8CFF; --verde:#4ADE9B; --rosa:#FF5FA8; --vermelho:#FF4D5E;
  --f-etapa:"Anton","Impact",sans-serif; --f-texto:"Inter",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--fundo)}
body{color:var(--texto);font-family:var(--f-texto);font-size:13px;line-height:1.45;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:12px 24px}
.app{max-width:1400px;margin:0 auto;border-radius:16px;padding:2px;background:linear-gradient(120deg,var(--ciano),var(--azul) 45%,var(--rosa))}
.dentro{background:var(--fundo);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-weight:700}
.logo i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--ciano),var(--rosa));display:inline-block}
.logo small{font-family:var(--f-mono);font-weight:400;color:var(--mudo)}
.etapas{display:flex;flex-wrap:wrap;gap:4px}
.etapa{font:600 12px var(--f-texto);padding:4px 10px;border-radius:999px;border:1px solid var(--linha);background:var(--painel);color:var(--mudo)}
.etapa.feita{color:var(--texto)}
.etapa.feita::before{content:"✓ ";color:var(--verde)}
.etapa.ativa{background:var(--amarelo);color:#1A1440;border-color:var(--amarelo)}
.contador{font-family:var(--f-mono);font-size:13px;color:var(--coral);font-weight:600;font-variant-numeric:tabular-nums}
.contador span{color:var(--mudo);font-weight:400}
.meio{display:grid;grid-template-columns:minmax(220px,290px) minmax(0,1fr) minmax(220px,290px);gap:10px}
@media (max-width:980px){.meio{grid-template-columns:minmax(0,1fr)}}
.caixa{background:var(--painel);border:1px solid var(--linha);border-radius:12px;padding:12px;min-width:0;position:relative}
.caixa h3{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.caixa h3 span{font:400 11px var(--f-mono);color:var(--coral)}
.form{display:flex;flex-direction:column;gap:9px}
label.rot{display:block;font:600 10px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mudo);margin-bottom:3px}
input[type=text],select,textarea{width:100%;font:inherit;color:var(--texto);background:var(--fundo);border:1px solid var(--linha);border-radius:8px;padding:7px 9px}
textarea{resize:vertical;min-height:64px}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;gap:6px;align-items:center;cursor:pointer}
.check input{accent-color:var(--ciano)}
.fotos{display:flex;gap:5px;flex-wrap:wrap}
.fotos img{width:40px;height:50px;object-fit:cover;border-radius:4px;border:1px solid var(--linha)}
.btn{font:600 13px var(--f-texto);cursor:pointer;border-radius:8px;padding:8px 14px;border:1px solid var(--linha);background:var(--painel2);color:var(--texto)}
.btn.prim{background:var(--coral);border-color:var(--coral);color:#1A1440}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.min{padding:4px 9px;font-size:12px}
input:focus-visible,select:focus-visible,textarea:focus-visible,.btn:focus-visible,.slide-mini:focus-visible{outline:2px solid var(--ciano);outline-offset:2px}
.palco h2{font-family:var(--f-etapa);font-weight:400;font-size:clamp(24px,3vw,38px);line-height:1;margin:0;text-transform:uppercase}
.palco h2 em{font-style:normal;color:var(--amarelo)}
.palco .sub{color:var(--mudo);margin:2px 0 10px}
.palco .numero{position:absolute;right:14px;top:12px;font-family:var(--f-mono);font-weight:600;font-size:clamp(20px,2.4vw,28px);font-variant-numeric:tabular-nums}
.palco-corpo{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:640px){.palco-corpo{grid-template-columns:minmax(0,1fr)}}
.grande{width:100%;max-width:300px;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--linha)}
.grande canvas{width:100%;height:100%;display:block}
.info{min-width:0;display:flex;flex-direction:column;gap:8px}
.stream{font:12px/1.55 var(--f-mono);color:var(--ciano);background:var(--fundo);border:1px solid var(--linha);border-radius:8px;padding:8px;max-height:260px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.editar{display:flex;flex-direction:column;gap:7px}
.aviso{color:var(--mudo);font-size:12px;margin:0}
.aviso b{color:var(--amarelo)}
.quadrados{display:flex;gap:3px;margin:0 0 10px;flex-wrap:wrap}
.quadrados i{width:12px;height:12px;border-radius:3px;opacity:.35;transition:opacity .2s}
.quadrados i.on{opacity:1}
.log{display:flex;flex-direction:column;gap:4px;font-size:12px;max-height:330px;overflow:hidden}
.log div{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;animation:entra .25s ease-out}
.log code{font:600 11px var(--f-mono)}
.log span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes entra{from{opacity:0;transform:translateY(-4px)}}
.faixa{overflow-x:auto}
.tl{display:grid;grid-template-columns:70px minmax(0,1fr);gap:0 8px;padding:10px;min-width:720px}
.nomes{display:flex;flex-direction:column;gap:4px}
.nomes div{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;height:18px}
.nomes div.alto{height:124px}
.nomes i{width:9px;height:9px;border-radius:3px;display:inline-block}
.colunas{display:grid;gap:6px}
.col{display:flex;flex-direction:column;gap:4px;min-width:0}
.slide-mini{width:99px;height:124px;align-self:center;flex:none;border-radius:6px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:var(--painel2);padding:0}
.slide-mini canvas{width:100%;height:100%;display:block}
.slide-mini[aria-pressed="true"]{border-color:var(--amarelo)}
.blk{height:18px;border-radius:4px;background:rgba(255,255,255,.04);font:600 9px/18px var(--f-mono);padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#140F33;transition:background .3s}
.transporte{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:0 10px 10px}
.grupo{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tempo{font-family:var(--f-mono);color:var(--mudo)}
.vel{font:600 12px var(--f-mono);padding:4px 8px;border-radius:6px;border:1px solid var(--linha);background:var(--painel);color:var(--mudo);cursor:pointer}
.vel[aria-pressed="true"]{color:var(--fundo);background:var(--ciano);border-color:var(--ciano)}
.cursor{position:absolute;left:0;top:0;pointer-events:none;z-index:5;transition:transform .45s cubic-bezier(.3,.7,.2,1),opacity .3s;display:flex;align-items:flex-start;gap:2px}
.cursor svg{width:14px;height:14px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.cursor b{font:600 10px var(--f-mono);padding:1px 5px;border-radius:4px;color:#140F33;margin-top:10px}
@media (prefers-reduced-motion:reduce){.cursor{display:none}.log div{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--texto);color:var(--fundo);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.legenda-post{font-size:12px;white-space:pre-wrap;background:var(--fundo);border:1px solid var(--linha);border-radius:8px;padding:8px;max-height:140px;overflow:auto}
</style>

<div class="app"><div class="dentro" id="app">
  <div class="barra">
    <div class="logo"><i></i>Carrosséis <small id="proj">Grace Studio</small></div>
    <div class="etapas" id="etapas"></div>
    <div class="contador" id="contador">0<span>/0 ações</span></div>
  </div>
  <div class="meio">
    <form class="caixa form" id="briefing" novalidate>
      <h3>Briefing <span id="exemplo">exemplo carregado</span></h3>
      <div><label class="rot" for="cliente">Cliente</label><select id="cliente"></select></div>
      <details id="cli-box"><summary class="rot" style="cursor:pointer">Identidade do cliente</summary>
        <div class="form" style="margin-top:8px">
          <div><label class="rot" for="cli-nome">Nome</label><input type="text" id="cli-nome"></div>
          <div><label class="rot" for="cli-seg">Segmento</label><input type="text" id="cli-seg" placeholder="Ex.: clínica odontológica, loja de roupas"></div>
          <div class="duas"><div><label class="rot" for="cli-cor">Cor principal</label><input type="color" id="cli-cor" style="width:100%;height:34px"></div>
            <div><label class="rot" for="cli-cor2">Cor de apoio</label><input type="color" id="cli-cor2" style="width:100%;height:34px"></div></div>
          <div class="duas"><div><label class="rot" for="cli-ft">Fonte do título</label><select id="cli-ft"></select></div>
            <div><label class="rot" for="cli-fx">Fonte do texto</label><select id="cli-fx"></select></div></div>
          <div><label class="rot" for="cli-logo">Logo (PNG, de preferência transparente)</label><input type="file" id="cli-logo" accept="image/png,image/svg+xml,image/jpeg"></div>
          <label class="check"><input type="checkbox" id="ibama"> Selo Ibama (anúncio de veículo)</label>
          <div class="grupo"><button class="btn min" type="button" id="cli-salvar">Salvar cliente</button><button class="btn min" type="button" id="cli-apagar">Apagar</button></div>
        </div>
      </details>
      <div><label class="rot" for="tema">Tema do carrossel</label><textarea id="tema"></textarea></div>
      <div><label class="rot" for="objetivo">Objetivo</label><select id="objetivo"><option>Educar o público</option><option>Vender produto ou serviço</option><option>Divulgar oferta</option><option>Gerar contatos</option><option>Engajamento</option><option>Institucional</option></select></div>
      <div class="duas">
        <div><label class="rot" for="nslides">Slides</label><select id="nslides"><option>5</option><option selected>6</option><option>7</option><option>8</option><option>10</option></select></div>
        <div><label class="rot" for="tom">Tom</label><select id="tom"><option>Direto</option><option>Premium</option><option>Leve</option><option>Técnico</option><option>Divertido</option></select></div>
      </div>
      <div><label class="rot" for="cta">Chamada final</label><input type="text" id="cta"></div>
      <div><label class="rot" for="dados">Informações obrigatórias (preço, datas, endereço)</label><textarea id="dados" style="min-height:48px" placeholder="Só entra no carrossel o que estiver aqui."></textarea></div>
      <div><label class="rot" for="arquivos">Fotos</label><input type="file" id="arquivos" accept="image/*" multiple><div class="fotos" id="fotos" style="margin-top:6px"></div></div>
      <button class="btn prim" type="submit" id="gerar">Gerar carrossel</button>
      <p class="aviso" id="aviso-ia"></p>
    </form>
    <div class="caixa palco"><h2 id="titulo"></h2><p class="sub" id="subtitulo"></p><div class="numero" id="numero"></div>
      <div class="palco-corpo">
        <div class="grande"><canvas id="grande" width="1080" height="1350"></canvas></div>
        <div class="info" id="info"></div>
      </div>
    </div>
    <div class="caixa"><h3>Agentes <span id="ativos"></span></h3><div class="quadrados" id="quadrados"></div><div class="log" id="log"></div></div>
  </div>
  <div class="caixa" style="padding:0">
    <div class="faixa"><div class="tl"><div class="nomes" id="nomes"></div><div class="colunas" id="colunas"></div></div></div>
    <div class="transporte">
      <div class="grupo"><span class="tempo">Velocidade</span><span id="vels"></span><button class="btn" type="button" id="pausa" disabled>Pausar</button></div>
      <div class="grupo"><button class="btn" type="button" id="copiar">Copiar legenda do post</button><button class="btn prim" type="button" id="exportar">Baixar slides (PNG 1080×1350)</button></div>
    </div>
  </div>
</div></div>
<div class="toast" id="toast" hidden></div>

<script>
const A = __ASSETS__;
const $ = s => document.querySelector(s);
const el = (t,c,x) => { const e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const reduz = matchMedia("(prefers-reduced-motion: reduce)").matches;
const W=1080, H=1350;
const FONTES={"Bricolage Grotesque":"opsz,wght@12..96,400;12..96,700;12..96,800","Figtree":"wght@400;600;800","Inter":"wght@400;600;800","Manrope":"wght@400;600;800","Montserrat":"wght@400;600;800","Poppins":"wght@400;600;800","Plus Jakarta Sans":"wght@400;600;800","DM Sans":"wght@400;600;800","Outfit":"wght@400;600;800","Sora":"wght@400;600;800","Space Grotesk":"wght@400;600;700","Raleway":"wght@400;600;800","Archivo":"wght@400;600;800","Syne":"wght@400;600;800","Unbounded":"wght@400;600;800","Oswald":"wght@400;600;700","Bebas Neue":"","Anton":"","Playfair Display":"wght@400;600;800","DM Serif Display":"","Lora":"wght@400;600;700"};
const EXEMPLO_CLI={id:"grace",nome:"Grace Studio",segmento:"Agência de vídeo e conteúdo",cor:"#FF6B4A",cor2:"#7C5CFF",fonteT:"Bricolage Grotesque",fonteX:"Inter",logo:null,ibama:false};
let clientes=[EXEMPLO_CLI];
try{ const c=JSON.parse(localStorage.getItem("gs_clientes")||"null"); if(Array.isArray(c)&&c.length) clientes=c; }catch(e){}
const logoImgs={};
const ETAPAS=["Briefing","Roteiro","Layout","Tipografia","Imagens","Cor","Exportar"];
const AG_COR={briefing:"--ciano",roteiro:"--amarelo",layout:"--rosa",tipo:"--azul",imagem:"--verde",cor:"--coral",export:"--ciano"};
const PISTAS=[["texto","Texto","--amarelo"],["layout","Layout","--rosa"],["imagem","Imagem","--verde"],["marca","Marca","--coral"]];
const LAYOUTS={capa:"Capa",foto:"Foto + texto",lista:"Lista",numero:"Número grande",citacao:"Frase de impacto",cta:"Chamada final"};

/* ---------- estado ---------- */
let C = null;            // carrossel: {marca, slides:[{tipo,titulo,destaque,texto,itens,numero,layout,foto,tam}], legenda}
let fotos = [];
let sel = 0, acoes=0, totalAcoes=0, etapa=-1, log=[], vel=1, pausado=false, rodando=false;
const imgs = {};
function carrega(src){ return new Promise(r=>{ const i=new Image(); i.onload=()=>r(i); i.onerror=()=>r(null); i.src=src; }); }

/* ---------- briefing e clientes ---------- */
const carregadas=new Set();
async function carregaFonte(f){ if(!f||carregadas.has(f)) return; carregadas.add(f);
  const l=document.createElement("link"); l.rel="stylesheet"; l.href="https://fonts.googleapis.com/css2?family="+f.replace(/ /g,"+")+(FONTES[f]?":"+FONTES[f]:"")+"&display=swap"; document.head.append(l);
  await new Promise(r=>{ l.onload=r; l.onerror=r; setTimeout(r,4000); });
  try{ await Promise.all([document.fonts.load(`800 80px "${f}"`),document.fonts.load(`400 40px "${f}"`)]); }catch(e){} }
Object.keys(FONTES).forEach(f=>{ ["#cli-ft","#cli-fx"].forEach(id=>{ const o=el("option",null,f); o.value=f; $(id).append(o); }); });
function listaClientes(id){ const s=$("#cliente"); s.innerHTML=""; clientes.forEach(c=>{ const o=el("option",null,c.nome); o.value=c.id; s.append(o); }); const n=el("option",null,"+ Novo cliente"); n.value="_novo"; s.append(n); if(id) s.value=id; }
function cliAtual(){ return clientes.find(c=>c.id===$("#cliente").value)||clientes[0]; }
async function preencheCli(c){ $("#cli-nome").value=c.nome; $("#cli-seg").value=c.segmento||""; $("#cli-cor").value=c.cor; $("#cli-cor2").value=c.cor2||c.cor; $("#cli-ft").value=c.fonteT; $("#cli-fx").value=c.fonteX; $("#ibama").checked=!!c.ibama;
  await Promise.all([carregaFonte(c.fonteT),carregaFonte(c.fonteX)]); if(c.logo&&!logoImgs[c.id]) logoImgs[c.id]=await carrega(c.logo); }
function leCli(){ const c=cliAtual(); return {...c, nome:$("#cli-nome").value.trim()||c.nome, segmento:$("#cli-seg").value.trim(), cor:$("#cli-cor").value, cor2:$("#cli-cor2").value, fonteT:$("#cli-ft").value, fonteX:$("#cli-fx").value, ibama:$("#ibama").checked}; }
function salvaClientes(){ try{ localStorage.setItem("gs_clientes",JSON.stringify(clientes)); }catch(e){ toast("Não deu para guardar o cliente neste navegador (logo grande demais?)."); } }
$("#cliente").onchange=async()=>{ if($("#cliente").value==="_novo"){ const c={id:"c"+Date.now(),nome:"Novo cliente",segmento:"",cor:"#2B6CF6",cor2:"#111827",fonteT:"Figtree",fonteX:"Inter",logo:null,ibama:false}; clientes.push(c); listaClientes(c.id); $("#cli-box").open=true; await preencheCli(c); $("#cli-nome").focus(); $("#cli-nome").select(); return; }
  await preencheCli(cliAtual()); aplicaCli(); };
async function aplicaCli(){ if(!C||rodando) return; const c=leCli(); await Promise.all([carregaFonte(c.fonteT),carregaFonte(c.fonteX)]); C.cliente=c; desenhaFaixa(); grande(); }
["#cli-cor","#cli-cor2","#cli-ft","#cli-fx","#ibama","#cli-nome"].forEach(id=>$(id).addEventListener("change",aplicaCli));
$("#cli-salvar").onclick=()=>{ const c=leCli(); const i=clientes.findIndex(x=>x.id===c.id); clientes[i]=c; salvaClientes(); listaClientes(c.id); toast("Cliente salvo: "+c.nome); };
$("#cli-apagar").onclick=async()=>{ if(clientes.length<2){ toast("Precisa ter pelo menos um cliente."); return; } const c=cliAtual(); if($("#cli-apagar").dataset.conf!==c.id){ $("#cli-apagar").dataset.conf=c.id; $("#cli-apagar").textContent="Confirmar apagar"; return; }
  clientes=clientes.filter(x=>x.id!==c.id); salvaClientes(); $("#cli-apagar").textContent="Apagar"; $("#cli-apagar").dataset.conf=""; listaClientes(clientes[0].id); await preencheCli(clientes[0]); aplicaCli(); };
$("#cli-logo").onchange=e=>{ const f=e.target.files[0]; if(!f) return; if(f.size>600000) toast("Logo grande: pode não caber para salvar. Prefira um PNG até 600 KB.");
  const rd=new FileReader(); rd.onload=async()=>{ const c=cliAtual(); c.logo=rd.result; logoImgs[c.id]=await carrega(rd.result); aplicaCli(); toast("Logo carregado. Toque em “Salvar cliente” para guardar."); }; rd.readAsDataURL(f); };
$("#tema").value="5 erros que fazem seu Reels perder alcance";
$("#cta").value="Fale com a Grace Studio";
$("#objetivo").value="Educar o público";
function desenhaFotos(){ const f=$("#fotos"); f.innerHTML=""; fotos.forEach(x=>{ const i=el("img"); i.src=x.src; i.alt=""; f.append(i); }); }
$("#arquivos").onchange=async e=>{
  const fs=[...e.target.files].slice(0,12); if(!fs.length) return;
  fotos = await Promise.all(fs.map(f=>new Promise(r=>{ const rd=new FileReader(); rd.onload=()=>r({src:rd.result,img:null}); rd.readAsDataURL(f); })));
  for(const f of fotos) f.img=await carrega(f.src);
  desenhaFotos(); toast(fotos.length+" foto(s) carregada(s). Gere o carrossel para usar.");
};

/* ---------- etapas / agentes / cursores ---------- */
ETAPAS.forEach(n=>$("#etapas").append(el("span","etapa",n)));
for(let i=0;i<14;i++){ const q=el("i"); q.style.background=css(Object.values(AG_COR)[i%7]); $("#quadrados").append(q); }
$("#ativos").textContent="14 ativos";
function marcaEtapa(e){ etapa=e; document.querySelectorAll(".etapa").forEach((b,i)=>{ b.classList.toggle("ativa",i===e); b.classList.toggle("feita",i<e||e>=ETAPAS.length); });
  Object.entries(cursores).forEach(([n,c])=>c.style.opacity= e<ETAPAS.length && n.startsWith(["briefing","roteiro","layout","tipo","imagem","cor","export"][e]) ? 1 : 0); }
function registra(ag,msg){ log.unshift([ag,msg]); log=log.slice(0,30); acoes++;
  const l=$("#log"); l.innerHTML=""; log.slice(0,18).forEach(([a,m])=>{ const d=el("div"); const c=el("code",null,a); c.style.color=css(AG_COR[a.split("-")[0]]||"--ciano"); d.append(c,el("span",null,m)); l.append(d); });
  $("#contador").innerHTML=""; $("#contador").append(String(acoes)); $("#contador").append(el("span",null,"/"+Math.max(acoes,totalAcoes)+" ações"));
  const q=$("#quadrados").children; for(let i=0;i<q.length;i++) q[i].classList.toggle("on", i<=acoes%14 || !rodando); }
const cursores={};
function aponta(nome, alvo){
  if(reduz||!alvo) return;
  let c=cursores[nome];

  $("#info").innerHTML=""; const it=el("div","stream"); it.textContent=`título: ${b.cliente.fonteT} · texto: ${b.cliente.fonteX}\n`; $("#info").append(it);
  const cx=document.createElement("canvas").getContext("2d");
  for(let i=0;i<C.slides.length;i++){ sel=i; const fam=b.cliente.fonteT; const t=ajusta(cx,C.slides[i].titulo,"",W-168,300,150,48,800,fam); desenhaFaixa(3); grande(3);
    it.textContent+=`slide ${i+1}: título ${t.tam}px · ${t.ls.length} linha(s)\n`; registra("tipo-0"+(i%2+1),`slide ${i+1}: título ${t.tam}px, ${t.ls.length} linha(s)`); aponta("tipo-0"+(i%2+1),document.getElementById("mini"+i)); await espera(380); }
  // 4 imagens
  marcaEtapa(4); palco("Escolhendo as <em>imagens</em>","Foto inteira na capa, recorte que preenche sem distorcer");
  $("#info").innerHTML=""; const ii=el("div","stream"); $("#info").append(ii);
  let k=0; for(let i=0;i<C.slides.length;i++){ const s=C.slides[i]; const usa = ["capa","foto","citacao","cta","numero"].includes(s.layout) && fotos.length; s.foto = usa ? (k++)%fotos.length : null; sel=i; desenhaFaixa(4); grande(4);
    ii.textContent+= `slide ${i+1}: ${s.foto!=null?"foto "+(s.foto+1)+" · recorte 4:5":"sem foto (fundo da marca)"}\n`; registra("imagem-0"+(i%3+1), s.foto!=null?`slide ${i+1}: foto ${s.foto+1}, recorte 4:5`:`slide ${i+1}: fundo sólido`); aponta("imagem-0"+(i%3+1),document.getElementById("b2_"+i)); await espera(420); }
  // 5 cor e marca
  marcaEtapa(5); palco("Aplicando <em>cor e marca</em>","Cor do cliente nos destaques, logo na capa e no fim, numeração com seta");
  $("#info").innerHTML=""; const ic=el("div","stream"); $("#info").append(ic);
  for(let i=0;i<C.slides.length;i++){ sel=i; desenhaFaixa(5); grande(5); ic.textContent+=`slide ${i+1}: cor ${b.cliente.cor}${b.cliente.ibama?" · Ibama":""}${C.slides[i].layout==="capa"||C.slides[i].layout==="cta"?" · logo":""}\n`;
    registra("cor-0"+(i%2+1),`slide ${i+1}: destaque em ${b.cliente.cor}`); aponta("cor-0"+(i%2+1),document.getElementById("b3_"+i)); await espera(380); }
  // 6 pronto
  marcaEtapa(6); palco("Pronto para <em>exportar</em>","PNG 1080×1350 (4:5), um arquivo por slide, em um .zip");
  registra("export-01",`${C.slides.length} slides prontos · 1080×1350`); aponta("export-01",$("#exportar")); await espera(400);
  registra("export-02","legenda do post pronta");
  terminar();
  try{ localStorage.setItem("gs_carrossel", JSON.stringify({C,b})); }catch(e){}
}
function terminar(){ rodando=false; marcaEtapa(ETAPAS.length); sel=0; desenhaFaixa(); grande(); editor(); $("#gerar").disabled=false; $("#pausa").disabled=true; $("#exemplo").textContent="pronto"; $("#numero").textContent=C.slides.length+" slides";
  Object.values(cursores).forEach(c=>c.style.opacity=0); palco("Carrossel <em>pronto</em>","Toque num slide para editar o texto, o layout ou a foto"); }
function editor(){
  const s=C.slides[sel], inf=$("#info"); inf.innerHTML="";
  const ed=el("div","editar");
  const campo=(rot,id,val,area,fn)=>{ const d=el("div"); const l=el("label","rot",rot); l.htmlFor=id; const i=el(area?"textarea":"input"); if(!area) i.type="text"; i.id=id; i.value=val||""; if(area) i.style.minHeight="56px"; i.oninput=()=>{ fn(i.value); grande(); atualizaMini(); }; d.append(l,i); ed.append(d); };
  ed.append(el("h3",null,"Slide "+(sel+1)));
  campo("Título","ed-t",s.titulo,false,v=>s.titulo=v);
  campo("Palavras em destaque","ed-d",s.destaque,false,v=>s.destaque=v);
  if(s.layout==="lista") campo("Itens (um por linha)","ed-i",(s.itens||[]).join("\n"),true,v=>s.itens=v.split("\n").filter(Boolean));
  else campo("Texto","ed-x",s.texto,true,v=>s.texto=v);
  if(s.layout==="numero") campo("Número","ed-n",s.numero,false,v=>s.numero=v);
  const d2=el("div","duas");
  const sl=el("select"); sl.id="ed-l"; Object.entries(LAYOUTS).forEach(([k,v])=>{ const o=el("option",null,v); o.value=k; sl.append(o); }); sl.value=s.layout; sl.onchange=()=>{ s.layout=sl.value; desenhaFaixa(); grande(); editor(); };
  const sf=el("select"); sf.id="ed-f"; const o0=el("option",null,"Sem foto"); o0.value=""; sf.append(o0); fotos.forEach((f,i)=>{ const o=el("option",null,"Foto "+(i+1)); o.value=i; sf.append(o); }); sf.value=s.foto??""; sf.onchange=()=>{ s.foto= sf.value===""?null:+sf.value; desenhaFaixa(); grande(); };
  const w1=el("div"); const l1=el("label","rot","Layout"); l1.htmlFor="ed-l"; w1.append(l1,sl); const w2=el("div"); const l2=el("label","rot","Foto"); l2.htmlFor="ed-f"; w2.append(l2,sf); d2.append(w1,w2); ed.append(d2);
  if(C.legenda){ const lp=el("div"); lp.append(el("label","rot","Legenda do post"), el("div","legenda-post",C.legenda)); ed.append(lp); }
  inf.append(ed);
}
function atualizaMini(){ const b=document.getElementById("mini"+sel); if(b) render(b.querySelector("canvas").getContext("2d"),C.slides[sel],sel,C.slides.length); const t=document.getElementById("b0_"+sel); if(t) t.textContent=(C.slides[sel].titulo||"").slice(0,24); }

/* ---------- controles ---------- */
[1,2,4].forEach(v=>{ const b=el("button","vel",v+"×"); b.type="button"; b.setAttribute("aria-pressed",v===1); b.onclick=()=>{ vel=v; document.querySelectorAll(".vel").forEach(x=>x.setAttribute("aria-pressed",x===b)); }; $("#vels").append(b); });
$("#pausa").onclick=()=>{ pausado=!pausado; $("#pausa").textContent=pausado?"Continuar":"Pausar"; if(!pausado&&esperaPausa){ const r=esperaPausa; esperaPausa=null; r(); } };
$("#briefing").onsubmit=e=>{ e.preventDefault(); if(rodando) return; const b=briefingAtual(); if(!b.tema){ toast("Escreva o tema do carrossel."); $("#tema").focus(); return; } gerar(b,true); };
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,3500); }
$("#copiar").onclick=async()=>{ const txt=C&&C.legenda||""; if(!txt){ toast("Ainda não tem legenda."); return; } try{ await navigator.clipboard.writeText(txt); toast("Legenda copiada."); }catch(e){ editor(); toast("Selecione e copie a legenda abaixo do editor."); } };
let downloads=null;
$("#exportar").onclick=async()=>{
  if(!C||rodando){ toast("Espere o carrossel terminar."); return; }
  const btn=$("#exportar"); btn.disabled=true;
  try{
    const zip=new JSZip(); const cv=document.createElement("canvas"); cv.width=W; cv.height=H; const ctx=cv.getContext("2d");
    for(let i=0;i<C.slides.length;i++){ render(ctx,C.slides[i],i,C.slides.length); const blob=await new Promise(r=>cv.toBlob(r,"image/png")); zip.file(`slide_${String(i+1).padStart(2,"0")}.png`,blob); }
    if(C.legenda) zip.file("legenda.txt", C.legenda);
    const z=await zip.generateAsync({type:"blob"}); const nome=`carrossel_${C.cliente.nome.toLowerCase().replace(/[^a-z0-9]+/g,"_")}_${new Date().toISOString().slice(0,10)}.zip`;
    if(!downloads){ toast("Baixar arquivos não está disponível nesta visualização. Abra a página no claude.ai."); }
    else { await downloads.save({filename:nome,data:z}); toast("Carrossel baixado: "+nome); }
  }catch(e){ toast(e&&e.code==="declined"?"Download cancelado.":"Não deu para baixar: "+(e.message||e.code)); }
  btn.disabled=false;
};

(async()=>{
  imgs.ibama=await carrega(A.ibama);

  const idIni = salvo&&salvo.C&&salvo.C.cliente&&clientes.some(c=>c.id===salvo.C.cliente.id) ? salvo.C.cliente.id : clientes[0].id;
  listaClientes(idIni); await preencheCli(cliAtual());
  if(salvo&&salvo.C&&salvo.C.cliente){ C=salvo.C; await Promise.all([carregaFonte(C.cliente.fonteT),carregaFonte(C.cliente.fonteX)]); if(salvo.b){ $("#tema").value=salvo.b.tema||""; $("#cta").value=salvo.b.cta||""; $("#dados").value=salvo.b.dados||""; } }
  else { const r=exemploGrace(); C={cliente:leCli(),slides:r.slides,legenda:r.legenda}; C.slides.forEach((s,i)=>{ s.layout= i===0?"capa": i===C.slides.length-1?"cta": s.tipo; s.foto=null; }); }
